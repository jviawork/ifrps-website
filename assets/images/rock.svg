<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Heavy rock</title>
  <desc id="desc">A large dark gray faceted rock with gold highlights.</desc>
  <defs>
    <linearGradient id="rockBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6671"/>
      <stop offset=".42" stop-color="#303944"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f99a3"/>
      <stop offset="1" stop-color="#4a545f"/>
    </linearGradient>
    <linearGradient id="facetGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b75f"/>
      <stop offset="1" stop-color="#80631d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(2 380 325)">
    <path
      d="M116 405
         L153 220
         L270 88
         L430 62
         L587 144
         L654 318
         L612 500
         L474 585
         L278 572
         L149 500
         Z"
      fill="url(#rockBase)"
      stroke="#0b1118"
      stroke-width="12"
      stroke-linejoin="round"/>

    <path d="M153 220 L270 88 L319 250 L116 405 Z"
      fill="url(#facetLight)" opacity=".88"/>
    <path d="M270 88 L430 62 L457 238 L319 250 Z"
      fill="#69747f" opacity=".9"/>
    <path d="M430 62 L587 144 L512 276 L457 238 Z"
      fill="#434d57"/>
    <path d="M587 144 L654 318 L512 276 Z"
      fill="#242d36"/>
    <path d="M116 405 L319 250 L337 463 L149 500 Z"
      fill="#3d4751"/>
    <path d="M319 250 L457 238 L474 442 L337 463 Z"
      fill="url(#facetGold)" opacity=".55"/>
    <path d="M457 238 L512 276 L612 500 L474 442 Z"
      fill="#202832"/>
    <path d="M149 500 L337 463 L278 572 Z"
      fill="#222b34"/>
    <path d="M337 463 L474 442 L474 585 L278 572 Z"
      fill="#161d25"/>
    <path d="M474 442 L612 500 L474 585 Z"
      fill="#0d1319"/>

    <path
      d="M242 184 L310 132 M510 178 L560 207 M222 434 L284 477 M493 385 L557 437"
      stroke="#c8d0d8"
      stroke-width="10"
      stroke-linecap="round"
      opacity=".38"/>
  </g>
</svg>
