<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Open scissors</title>
  <desc id="desc">Heavy dark handled steel scissors viewed from above.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".22" stop-color="#9aa4ae"/>
      <stop offset=".5" stop-color="#eef2f5"/>
      <stop offset=".78" stop-color="#6f7882"/>
      <stop offset="1" stop-color="#d7dde2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2734"/>
      <stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-8 380 380)">
    <path
      d="M348 370
         L108 672
         Q92 692 116 704
         Q137 714 153 696
         L390 421
         Z"
      fill="url(#steel)"
      stroke="#3a4149"
      stroke-width="8"
      stroke-linejoin="round"/>

    <path
      d="M412 370
         L652 672
         Q668 692 644 704
         Q623 714 607 696
         L370 421
         Z"
      fill="url(#steel)"
      stroke="#3a4149"
      stroke-width="8"
      stroke-linejoin="round"/>

    <path
      d="M346 383
         C292 316 235 238 193 167
         C158 108 178 50 236 40
         C301 29 341 82 329 142
         C318 198 334 275 380 350
         Z"
      fill="url(#handle)"
      stroke="#4f5c69"
      stroke-width="12"/>

    <path
      d="M414 383
         C468 316 525 238 567 167
         C602 108 582 50 524 40
         C459 29 419 82 431 142
         C442 198 426 275 380 350
         Z"
      fill="url(#handle)"
      stroke="#4f5c69"
      stroke-width="12"/>

    <ellipse cx="246" cy="118" rx="55" ry="72" fill="#101923" stroke="#708090" stroke-width="10"/>
    <ellipse cx="514" cy="118" rx="55" ry="72" fill="#101923" stroke="#708090" stroke-width="10"/>

    <circle cx="380" cy="382" r="42" fill="#d7b75f" stroke="#8e6c1f" stroke-width="9"/>
    <circle cx="380" cy="382" r="12" fill="#2a323b"/>
  </g>
</svg>
